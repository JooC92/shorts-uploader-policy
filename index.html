<p>Shorts Uploader는 지알엔(GRN) 내부 직원이 회사 YouTube 채널에 영상을 업로드하기 위해 쓰는 사내 전용 도구입니다. 일반 사용자에게 제공하지 않습니다.</p>
<ul>
  <li>Google 계정 인증 정보(토큰)는 업로드를 실행하는 직원의 컴퓨터에만 저장되며, 외부 서버로 전송하거나 제3자와 공유하지 않습니다.</li>
  <li>YouTube API로 받은 데이터는 영상 업로드와 업로드 상태 확인에만 사용합니다.</li>
